[project]
name = "langchain-collector"
version = "1.0.0"
description = "Creative Career Fortune Teller Chatbot"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "langchain-core==0.3.79",
    "langchain-aws==0.2.31",
    "langgraph==0.6.7",
    "boto3==1.40.66",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "redis>=5.0.0",
    "tenacity>=8.2.0",
    "chromadb==1.3.5",
    "langchain==0.3.27",
    "langchain-community==0.3.29",
    "langchain-text-splitters==0.3.11",
    "langchain-redis==0.2.4",
    "pymupdf==1.26.4",
    "langwatch>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]
